name: Release

# Push a version tag (e.g. `v1.1.0`) to build the Windows installer and
# publish it as a GitHub Release. The electron-updater built into the app
# watches these releases, so a new tag = an automatic update for users.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch yt-dlp (bundled fallback downloader)
        shell: bash
        run: |
          if [ ! -f yt-dlp.exe ]; then
            curl -sL -o yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Selftest
        run: npm run selftest

      - name: Build + publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
